services:

  mongodb:
    image: mongo:8
    container_name: expense-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: expense-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/expense_tracker
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: expense-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data: